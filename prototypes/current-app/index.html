<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MadhvaNidhi Material dashboard studio</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#eaeaea;font:14px Roboto,Arial,sans-serif;color:#252525}header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#fff}header select{padding:8px;border:1px solid #888;border-radius:8px;background:#fff}main{display:grid;place-items:start center;padding:24px}iframe{border:0;border-radius:28px;box-shadow:0 12px 60px #00000012;background:#f5f5f5}#size{margin-left:auto;font-size:12px}</style></head>
<body><header><strong>MadhvaNidhi · Material 3</strong><select id="viewport" aria-label="Preview device"><option value="387,854">Galaxy M11 · 387 × 854</option><option value="360,800">Compact phone · 360 × 800</option><option value="412,915">Large phone · 412 × 915</option></select><span id="size">Demo practice data</span></header><main><iframe title="Material dashboard preview" id="preview" src="./shell.html"></iframe></main>
<script>const frame=document.querySelector('#preview'),select=document.querySelector('#viewport');function fit(){const [w,h]=select.value.split(',').map(Number);frame.style.width=w+'px';frame.style.height=h+'px';}select.addEventListener('change',fit);
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin||event.data?.type!=='material-reader-layout')return;if(event.data.landscape){const [w,h]=select.value.split(',').map(Number);frame.style.width=h+'px';frame.style.height=w+'px';}else fit();});fit();</script></body></html>
