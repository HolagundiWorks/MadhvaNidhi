<!doctype html>
<html lang="en" data-theme="g100">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>MadhvaNidhi Mockup</title>
<link rel="stylesheet" href="../ibm-plex.css">
<link rel="stylesheet" href="./carbon-theme.css">
<link rel="stylesheet" href="../carbon-app.css?v=edge-chrome">
<link rel="stylesheet" href="../studio.css?v=edge-chrome">
<body>
  <div class="studio-bar" role="region" aria-label="Preview size">
    <label for="viewport">Screen size</label>
    <select id="viewport" aria-label="Portrait preview size"></select>
    <div id="custom-fields">
      <label for="custom-w">W</label>
      <input id="custom-w" type="number" min="240" step="1" aria-label="Custom width">
      <label for="custom-h">H</label>
      <input id="custom-h" type="number" min="321" step="1" aria-label="Custom height">
    </div>
    <span id="viewport-error" class="error" hidden></span>
    <span id="dimensions" class="dims" aria-live="polite"></span>
  </div>
  <div class="stage">
    <div class="frame-wrap">
      <iframe src="./shell.html" title="MadhvaNidhi live preview" id="preview"></iframe>
    </div>
  </div>
  <script src="../studio.js" data-storage="madhva-app-shell-viewport-v2-portrait"></script>
</body>
</html>
